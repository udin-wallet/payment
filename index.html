<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - Miftah Muhtadiin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:70px 20px;

    /* Gradient lebih putih */
    background: linear-gradient(180deg, #f9fafb 0%, #f1f3f5 100%);
}

/* PROFILE */
.profile{
    text-align:center;
    margin-bottom:60px;
    opacity:0;
    transform:translateY(-30px);
    animation:fadeDown 1.2s ease forwards;
}

.profile img{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 15px 40px rgba(0,0,0,0.12);
    margin-bottom:18px;
}

.profile h2{
    font-size:22px;
    font-weight:600;
    color:#222;
}

/* CARD */
.box{
    width:100%;
    max-width:430px;
    padding:28px;
    margin-bottom:25px;

    display:flex;
    flex-direction:column;        /* center vertical layout */
    align-items:center;           /* center horizontal */
    justify-content:center;

    text-align:center;

    border-radius:30px;

    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.8);

    box-shadow:0 10px 35px rgba(0,0,0,0.06);

    cursor:pointer;

    opacity:0;
    transform:translateY(40px);
    animation:fadeUp 1.2s ease forwards;
    transition:all 0.4s ease;
}

/* Delay smooth */
.box:nth-of-type(2){ animation-delay:0.4s; }
.box:nth-of-type(3){ animation-delay:0.7s; }
.box:nth-of-type(4){ animation-delay:1s; }
.box:nth-of-type(5){ animation-delay:1.3s; }

.box:hover{
    transform:translateY(-5px);
    box-shadow:0 18px 45px rgba(0,0,0,0.08);
}

/* Logo */
.payment-logo{
    width:60px;
    height:60px;
    object-fit:contain;
    margin-bottom:15px;
}

/* Text */
.info h3{
    font-size:14px;
    font-weight:500;
    color:#666;
    margin-bottom:6px;
}

.info p{
    font-size:18px;
    font-weight:600;
    color:#111;
    letter-spacing:0.8px;
}

/* Toast */
.toast{
    position:fixed;
    bottom:40px;
    background:#111;
    color:white;
    padding:14px 28px;
    border-radius:40px;
    font-size:13px;
    opacity:0;
    transform:translateY(30px);
    transition:all 0.4s ease;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* Animations */
@keyframes fadeUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeDown{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="profile">
    <img src="logo.png" alt="Profile">
    <h2>Miftah Muhtadiin</h2>
</div>

<div class="box" onclick="copyText('1570041220')">
    <img src="bca.png" class="payment-logo">
    <div class="info">
        <h3>Miftah Muhtadiin</h3>
        <p>1570041220</p>
    </div>
</div>

<div class="box" onclick="copyText('1300026102817')">
    <img src="mandiri.png" class="payment-logo">
    <div class="info">
        <h3>Miftah Muhtadiin</h3>
        <p>1300026102817</p>
    </div>
</div>

<div class="box" onclick="copyText('901220026807')">
    <img src="seabank.png" class="payment-logo">
    <div class="info">
        <h3>Miftah Muhtadiin</h3>
        <p>901220026807</p>
    </div>
</div>

<div class="box" onclick="copyText('082218783050')">
    <img src="dana.png" class="payment-logo">
    <div class="info">
        <h3>Miftah Muhtadiin</h3>
        <p>082218783050</p>
    </div>
</div>

<div id="toast" class="toast">Berhasil disalin ✓</div>

<script>
function copyText(text){
    navigator.clipboard.writeText(text);

    const toast=document.getElementById("toast");
    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },2000);
}
</script>

</body>
</html>

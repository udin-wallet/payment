<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - Miftah Muhtadiin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: #f4f4f4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
}

/* ===== PROFILE ===== */
.profile {
    text-align: center;
    margin-bottom: 35px;
}

.profile img {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    margin-bottom: 15px;
}

.profile h2 {
    font-size: 20px;
    font-weight: 600;
    color: #333;
}

/* ===== CARD PAYMENT ===== */
.box {
    width: 100%;
    max-width: 420px;
    background: #e9ecef;
    border-radius: 30px;
    padding: 18px 22px;
    margin-bottom: 18px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    transition: 0.3s;
}

.box:hover {
    transform: scale(1.02);
    background: #dde1e4;
}

/* Logo */
.payment-logo {
    width: 45px;
    height: 45px;
    object-fit: contain;
}

/* Info */
.info {
    flex: 1;
    margin-left: 15px;
}

.info h3 {
    font-size: 14px;
    font-weight: 600;
    color: #444;
}

.info p {
    font-size: 15px;
    font-weight: 600;
    color: #222;
}

/* Button */
button {
    padding: 7px 15px;
    border: none;
    border-radius: 20px;
    background: #333;
    color: white;
    font-size: 12px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: black;
}

/* Toast */
.toast {
    position: fixed;
    bottom: 30px;
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 13px;
    opacity: 0;
    transition: 0.4s;
}

.toast.show {
    opacity: 1;
}

</style>
</head>

<body>

<!-- ===== PROFILE ===== -->
<div class="profile">
    <img src="logo.png" alt="Profile">
    <h2>Miftah Muhtadiin</h2>
</div>

<!-- ===== BCA ===== -->
<div class="box">
    <img src="bca.png" class="payment-logo">
    <div class="info">
        <h3>Miftah Muhtadiin</h3>
        <p id="bca">1570041220</p>
    </div>
    <button onclick="copyText('bca')">Copy</button>
</div>

<!-- ===== Mandiri ===== -->
<div class="box">
    <img src="mandiri.png" class="payment-logo">
    <div class="info">
        <h3>Miftah Muhtadiin</h3>
        <p id="mandiri">1300026102817</p>
    </div>
    <button onclick="copyText('mandiri')">Copy</button>
</div>

<!-- ===== Seabank ===== -->
<div class="box">
    <img src="seabank.png" class="payment-logo">
    <div class="info">
        <h3>Miftah Muhtadiin</h3>
        <p id="seabank">901220026807</p>
    </div>
    <button onclick="copyText('seabank')">Copy</button>
</div>

<!-- ===== DANA ===== -->
<div class="box">
    <img src="dana.png" class="payment-logo">
    <div class="info">
        <h3>Miftah Muhtadiin</h3>
        <p id="dana">082218783050</p>
    </div>
    <button onclick="copyText('dana')">Copy</button>
</div>

<div id="toast" class="toast">Number Copied!</div>

<script>
function copyText(id) {
    var text = document.getElementById(id).innerText;
    navigator.clipboard.writeText(text);

    var toast = document.getElementById("toast");
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2000);
}
</script>

</body>
</html>
